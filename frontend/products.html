<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Catalog - Digital Marketplace</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- FontAwesome 6 -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <!-- Google Fonts: Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/marketplace.css">
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar navbar-expand-lg navbar-marketplace">
    <div class="container">
      <a class="navbar-brand brand-logo" href="index.html">
        <i class="fas fa-cubes-stacked text-primary"></i>
        <span>Market</span>Place
      </a>

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#marketplaceNavbar">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="marketplaceNavbar">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-3">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link active" href="products.html">Products</a></li>
          <li class="nav-item"><a class="nav-link" href="categories.html">Categories</a></li>
          <li class="nav-item"><a class="nav-link" href="products.html?has_discount=true">Offers</a></li>
          <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
          <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
        </ul>

        <div class="d-flex align-items-center gap-3">
          <a href="wishlist.html" class="nav-action-btn" title="Saved Wishlist">
            <i class="far fa-heart"></i>
            <span class="badge-counter wishlist-count-badge" style="display: none;">0</span>
          </a>
          <a href="cart.html" class="nav-action-btn" title="Shopping Cart">
            <i class="fas fa-shopping-bag"></i>
            <span class="badge-counter cart-count-badge" style="display: none;">0</span>
          </a>
          <div id="nav-auth-container" class="d-flex align-items-center"></div>
        </div>
      </div>
    </div>
  </nav>

  <div class="bg-white border-bottom py-3 mb-4">
    <div class="container d-flex flex-wrap justify-content-between align-items-center gap-3">
      <div>
        <h4 class="fw-bold mb-0">Explore Marketplace Catalog</h4>
        <span class="text-muted small" id="products-count-display">Loading items...</span>
      </div>

      <!-- Quick Search Bar -->
      <div class="d-flex gap-2 flex-grow-1 flex-md-grow-0" style="max-width: 400px;">
        <div class="input-group">
          <span class="input-group-text bg-white"><i class="fas fa-search text-muted"></i></span>
          <input type="text" id="catalog-search-input" class="form-control" placeholder="Search by name, brand, seller...">
        </div>
      </div>
    </div>
  </div>

  <main class="container mb-5">
    <div class="row g-4">

      <!-- SIDEBAR FILTERS (Left Column) -->
      <aside class="col-lg-3 col-md-4">
        <div class="filter-card">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h6 class="fw-bold mb-0"><i class="fas fa-sliders me-2 text-primary"></i>Filters</h6>
            <button class="btn btn-link btn-sm text-danger p-0 text-decoration-none" onclick="clearAllFilters()">Reset</button>
          </div>

          <!-- CATEGORIES -->
          <div class="filter-group">
            <h6>Category</h6>
            <div id="filter-categories-list" style="max-height: 200px; overflow-y: auto;">
              <!-- Loaded dynamically -->
            </div>
          </div>

          <!-- PRICE RANGE -->
          <div class="filter-group">
            <h6>Price Range (₹)</h6>
            <div class="row g-2 mb-2">
              <div class="col-6">
                <input type="number" id="filter-min-price" class="form-control form-control-sm" placeholder="Min">
              </div>
              <div class="col-6">
                <input type="number" id="filter-max-price" class="form-control form-control-sm" placeholder="Max">
              </div>
            </div>
            <button id="price-filter-apply-btn" class="btn btn-outline-primary btn-sm w-100">Apply Price</button>
          </div>

          <!-- AVAILABILITY -->
          <div class="filter-group">
            <h6>Availability</h6>
            <div class="form-check mb-1">
              <input class="form-check-input" type="radio" name="availability_filter" id="avail-all" value="" checked>
              <label class="form-check-label small" for="avail-all">All Items</label>
            </div>
            <div class="form-check mb-1">
              <input class="form-check-input" type="radio" name="availability_filter" id="avail-instock" value="in_stock">
              <label class="form-check-label small" for="avail-instock">In Stock Only</label>
            </div>
            <div class="form-check">
              <input class="form-check-input" type="radio" name="availability_filter" id="avail-outstock" value="out_of_stock">
              <label class="form-check-label small" for="avail-outstock">Out of Stock</label>
            </div>
          </div>

          <!-- MIN RATING -->
          <div class="filter-group">
            <h6>Customer Rating</h6>
            <div class="form-check mb-1">
              <input class="form-check-input" type="radio" name="rating_filter" id="rate-all" value="" checked>
              <label class="form-check-label small" for="rate-all">All Ratings</label>
            </div>
            <div class="form-check mb-1">
              <input class="form-check-input" type="radio" name="rating_filter" id="rate-4" value="4">
              <label class="form-check-label small" for="rate-4">4★ & above</label>
            </div>
            <div class="form-check mb-1">
              <input class="form-check-input" type="radio" name="rating_filter" id="rate-3" value="3">
              <label class="form-check-label small" for="rate-3">3★ & above</label>
            </div>
          </div>

          <!-- DISCOUNT ONLY -->
          <div class="filter-group mb-0">
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="filter-discount-only">
              <label class="form-check-label small fw-bold text-danger" for="filter-discount-only">
                <i class="fas fa-tag me-1"></i>Discounted Deals Only
              </label>
            </div>
          </div>

        </div>
      </aside>

      <!-- PRODUCT LISTINGS (Right Column) -->
      <section class="col-lg-9 col-md-8">
        <!-- Sort Bar -->
        <div class="d-flex justify-content-between align-items-center bg-white p-3 rounded-3 border mb-4">
          <span class="small text-muted">Sort By:</span>
          <div style="min-width: 180px;">
            <select id="catalog-sort-select" class="form-select form-select-sm">
              <option value="newest">Newest Arrivals</option>
              <option value="price_asc">Price: Low to High</option>
              <option value="price_desc">Price: High to Low</option>
              <option value="rating">Highest Rated</option>
              <option value="popularity">Popularity</option>
              <option value="discount">Biggest Discount</option>
            </select>
          </div>
        </div>

        <!-- Products Grid -->
        <div class="row" id="products-grid">
          <!-- Populated dynamically by products.js -->
        </div>

        <!-- Pagination -->
        <nav class="mt-4" id="pagination-container">
          <!-- Populated dynamically -->
        </nav>
      </section>

    </div>
  </main>

  <!-- FOOTER -->
  <footer class="marketplace-footer">
    <div class="container text-center text-muted small">
      <p class="mb-0">&copy; 2026 Digital Marketplace Management Platform. All rights reserved.</p>
    </div>
  </footer>

  <!-- Bootstrap 5 JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- API & Catalog Scripts -->
  <script src="js/api.js"></script>
  <script src="js/products.js"></script>
</body>
</html>
