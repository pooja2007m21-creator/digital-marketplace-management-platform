<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Portal Login - Digital Marketplace</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- FontAwesome 6 -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <!-- Google Fonts: Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/auth.css">
</head>
<body class="bg-dark">

  <nav class="navbar navbar-dark bg-dark border-bottom border-secondary py-3">
    <div class="container justify-content-between">
      <a class="navbar-brand brand-logo text-white" href="/index.html">
        <i class="fas fa-shield-halved text-danger"></i>
        <span class="text-white">Admin</span>Control
      </a>
      <a href="/index.html" class="btn btn-outline-light btn-sm">
        <i class="fas fa-arrow-left me-1"></i>Back to Marketplace
      </a>
    </div>
  </nav>

  <div class="auth-wrapper">
    <div class="auth-card border-0">
      <div class="auth-header" style="background: linear-gradient(135deg, #991b1b 0%, #b91c1c 100%);">
        <h3><i class="fas fa-user-shield me-2"></i>Admin Console</h3>
        <p>Platform Administration, User Moderation & Merchant Verification</p>
      </div>

      <div class="auth-body">
        <form id="login-form">
          <div class="form-floating mb-3">
            <input type="text" class="form-control" id="login-identifier" placeholder="Admin Email / Username" required>
            <label for="login-identifier">Administrator Username / Email</label>
          </div>

          <div class="form-floating mb-4">
            <input type="password" class="form-control" id="login-password" placeholder="Password" required>
            <label for="login-password">Password</label>
          </div>

          <button type="submit" class="btn btn-danger w-100 py-2 fs-6 mb-3">
            <i class="fas fa-lock-open me-2"></i>Authenticate Administrator
          </button>
        </form>

        <div class="demo-credentials-box mt-4 border-danger">
          <div class="small fw-bold text-danger mb-2"><i class="fas fa-key me-1"></i>Admin Demo Credentials:</div>
          <span class="demo-chip border-danger text-danger" onclick="fillDemoCredentials('admin@marketplace.com', 'admin123')">
            admin@marketplace.com / admin123
          </span>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
