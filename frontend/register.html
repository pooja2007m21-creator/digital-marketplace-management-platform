<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register Account - Digital Marketplace</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- FontAwesome 6 -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <!-- Google Fonts: Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Stylesheets -->
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/auth.css">
</head>
<body>

  <!-- SIMPLE NAVBAR -->
  <nav class="navbar navbar-light bg-white border-bottom py-3">
    <div class="container justify-content-between">
      <a class="navbar-brand brand-logo" href="/index.html">
        <i class="fas fa-cubes-stacked text-primary"></i>
        <span>Market</span>Place
      </a>
      <a href="/login.html" class="btn btn-outline-secondary btn-sm">
        <i class="fas fa-sign-in-alt me-1"></i>Already registered? Login
      </a>
    </div>
  </nav>

  <div class="auth-wrapper">
    <div class="auth-card" style="max-width: 600px;">
      <div class="auth-header">
        <h3><i class="fas fa-user-plus me-2"></i>Create an Account</h3>
        <p>Join the digital marketplace as a Customer or Seller</p>
      </div>

      <div class="auth-body">
        <form id="register-form">

          <!-- User Role Selection -->
          <label class="form-label small fw-bold text-muted text-uppercase mb-2">Account Type:</label>
          <div class="row g-2 mb-3">
            <div class="col-6">
              <input type="radio" class="btn-check" name="user_type" id="role-customer" value="CUSTOMER" checked>
              <label class="btn btn-outline-primary w-100 py-2 fw-semibold" for="role-customer">
                <i class="fas fa-shopping-bag me-1"></i>Customer
              </label>
            </div>
            <div class="col-6">
              <input type="radio" class="btn-check" name="user_type" id="role-seller" value="SELLER">
              <label class="btn btn-outline-primary w-100 py-2 fw-semibold" for="role-seller">
                <i class="fas fa-store me-1"></i>Merchant / Seller
              </label>
            </div>
          </div>

          <div class="row g-2 mb-3">
            <div class="col-md-6">
              <div class="form-floating">
                <input type="text" class="form-control" id="reg-name" placeholder="Full Name" required>
                <label for="reg-name">Full Name *</label>
              </div>
            </div>
            <div class="col-md-6">
              <div class="form-floating">
                <input type="text" class="form-control" id="reg-username" placeholder="Username" required>
                <label for="reg-username">Username *</label>
              </div>
            </div>
          </div>

          <div class="row g-2 mb-3">
            <div class="col-md-6">
              <div class="form-floating">
                <input type="email" class="form-control" id="reg-email" placeholder="name@example.com" required>
                <label for="reg-email">Email Address *</label>
              </div>
            </div>
            <div class="col-md-6">
              <div class="form-floating">
                <input type="tel" class="form-control" id="reg-phone" placeholder="Phone Number">
                <label for="reg-phone">Phone Number</label>
              </div>
            </div>
          </div>

          <!-- Seller Specific Fields -->
          <div id="seller-extra-fields" class="d-none border rounded p-3 bg-light mb-3">
            <h6 class="fw-bold text-primary mb-2"><i class="fas fa-building me-1"></i>Business Information</h6>
            <div class="form-floating mb-2">
              <input type="text" class="form-control" id="reg-business-name" placeholder="Business / Store Name">
              <label for="reg-business-name">Business / Store Name</label>
            </div>
            <div class="form-floating mb-2">
              <textarea class="form-control" id="reg-business-desc" placeholder="Business Description" style="height: 70px;"></textarea>
              <label for="reg-business-desc">Business Description</label>
            </div>
            <div class="form-floating">
              <input type="text" class="form-control" id="reg-business-addr" placeholder="Business Address">
              <label for="reg-business-addr">Registered Business Address</label>
            </div>
          </div>

          <div class="row g-2 mb-4">
            <div class="col-md-6">
              <div class="form-floating">
                <input type="password" class="form-control" id="reg-password" placeholder="Password" required minlength="6">
                <label for="reg-password">Password (min 6 chars) *</label>
              </div>
            </div>
            <div class="col-md-6">
              <div class="form-floating">
                <input type="password" class="form-control" id="reg-confirm-password" placeholder="Confirm Password" required minlength="6">
                <label for="reg-confirm-password">Confirm Password *</label>
              </div>
            </div>
          </div>

          <button type="submit" class="btn btn-primary w-100 py-2 fs-6 mb-3">
            <i class="fas fa-user-check me-2"></i>Complete Registration
          </button>

          <div class="text-center small text-muted">
            Already have an account? <a href="/login.html" class="fw-bold">Sign In here</a>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Bootstrap 5 JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- API & Auth JS -->
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
