<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Support - Digital Marketplace</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- FontAwesome 6 -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <!-- Google Fonts: Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/marketplace.css">
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar navbar-expand-lg navbar-marketplace">
    <div class="container">
      <a class="navbar-brand brand-logo" href="/index.html">
        <i class="fas fa-cubes-stacked text-primary"></i>
        <span>Market</span>Place
      </a>
      <div class="collapse navbar-collapse" id="marketplaceNavbar">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-3">
          <li class="nav-item"><a class="nav-link" href="/index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="/products.html">Products</a></li>
          <li class="nav-item"><a class="nav-link" href="/categories.html">Categories</a></li>
          <li class="nav-item"><a class="nav-link" href="/about.html">About</a></li>
          <li class="nav-item"><a class="nav-link active" href="/contact.html">Contact</a></li>
        </ul>
        <div id="nav-auth-container" class="d-flex align-items-center"></div>
      </div>
    </div>
  </nav>

  <main class="container py-5 mb-5">
    <div class="row g-4 justify-content-center">
      <div class="col-lg-7">
        <div class="card card-custom p-4">
          <h3 class="fw-bold mb-2">Get in Touch</h3>
          <p class="text-muted small mb-4">Have questions regarding orders, seller onboarding, or technical integration? Reach out below.</p>
          
          <form onsubmit="event.preventDefault(); showToast('Message sent! Support will contact you shortly.', 'success'); this.reset();">
            <div class="row g-3 mb-3">
              <div class="col-md-6">
                <label class="form-label small fw-semibold">Your Name *</label>
                <input type="text" class="form-control" required>
              </div>
              <div class="col-md-6">
                <label class="form-label small fw-semibold">Email Address *</label>
                <input type="email" class="form-control" required>
              </div>
            </div>

            <div class="mb-3">
              <label class="form-label small fw-semibold">Subject *</label>
              <input type="text" class="form-control" required>
            </div>

            <div class="mb-4">
              <label class="form-label small fw-semibold">Your Message *</label>
              <textarea class="form-control" rows="4" required></textarea>
            </div>

            <button type="submit" class="btn btn-primary px-4">
              <i class="fas fa-paper-plane me-1"></i>Send Inquiry
            </button>
          </form>
        </div>
      </div>
    </div>
  </main>

  <footer class="marketplace-footer">
    <div class="container text-center text-muted small">
      <p class="mb-0">&copy; 2026 Digital Marketplace Management Platform. All rights reserved.</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
</body>
</html>
