<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add / Edit Product - Seller Portal</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- FontAwesome 6 -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <!-- Google Fonts: Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Stylesheets -->
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/dashboard.css">
  <link rel="stylesheet" href="/css/seller.css">
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar navbar-light bg-white border-bottom py-2 px-3 sticky-top">
    <div class="container-fluid justify-content-between">
      <div class="d-flex align-items-center gap-3">
        <a class="brand-logo fs-5" href="/index.html">
          <i class="fas fa-store text-primary"></i>
          <span>Merchant</span>Center
        </a>
        <span class="badge bg-primary-subtle text-primary fw-bold">Seller Portal</span>
      </div>
      <div class="d-flex align-items-center gap-3">
        <a href="/seller/products.html" class="btn btn-outline-secondary btn-sm"><i class="fas fa-arrow-left me-1"></i>Back to Products</a>
        <div id="nav-auth-container"></div>
      </div>
    </div>
  </nav>

  <div class="dashboard-layout">
    
    <!-- SIDEBAR -->
    <aside class="dashboard-sidebar">
      <div class="sidebar-heading">Store Operations</div>
      <ul class="sidebar-nav">
        <li><a href="/seller/dashboard.html" class="sidebar-link"><i class="fas fa-chart-line"></i>Dashboard</a></li>
        <li><a href="/seller/products.html" class="sidebar-link"><i class="fas fa-boxes-stacked"></i>My Products</a></li>
        <li><a href="/seller/add-product.html" class="sidebar-link active"><i class="fas fa-plus-circle"></i>Add Product</a></li>
        <li><a href="/seller/inventory.html" class="sidebar-link"><i class="fas fa-warehouse"></i>Inventory</a></li>
        <li><a href="/seller/orders.html" class="sidebar-link"><i class="fas fa-truck-ramp-box"></i>Orders</a></li>
      </ul>
      <div class="sidebar-heading">Account</div>
      <ul class="sidebar-nav mt-auto">
        <li><a href="/profile.html" class="sidebar-link"><i class="fas fa-cog"></i>Settings</a></li>
        <li><a href="javascript:void(0)" onclick="logout()" class="sidebar-link text-danger"><i class="fas fa-sign-out-alt"></i>Sign Out</a></li>
      </ul>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="dashboard-main">
      <div class="mb-4">
        <h3 class="fw-bold mb-1" id="form-heading">Create New Product</h3>
        <p class="text-muted small mb-0">Fill in product details, pricing, inventory stock, and image asset.</p>
      </div>

      <div class="card card-custom p-4 max-w-900">
        <form id="product-form">
          <div class="row g-3 mb-3">
            <div class="col-md-8">
              <label class="form-label small fw-semibold">Product Title *</label>
              <input type="text" class="form-control" id="prod-name" placeholder="e.g. Wireless Noise Cancelling Headphones" required>
            </div>
            <div class="col-md-4">
              <label class="form-label small fw-semibold">Category *</label>
              <select class="form-select" id="prod-category" required>
                <!-- Loaded dynamically -->
              </select>
            </div>
          </div>

          <div class="row g-3 mb-3">
            <div class="col-md-4">
              <label class="form-label small fw-semibold">Brand / Manufacturer</label>
              <input type="text" class="form-control" id="prod-brand" placeholder="e.g. Sony, Nike, Apple">
            </div>
            <div class="col-md-4">
              <label class="form-label small fw-semibold">SKU (Stock Keeping Unit)</label>
              <input type="text" class="form-control" id="prod-sku" placeholder="Leave empty for auto-SKU">
            </div>
            <div class="col-md-4">
              <label class="form-label small fw-semibold">Listing Status *</label>
              <select class="form-select" id="prod-status">
                <option value="ACTIVE">ACTIVE</option>
                <option value="INACTIVE">INACTIVE</option>
                <option value="OUT_OF_STOCK">OUT OF STOCK</option>
              </select>
            </div>
          </div>

          <div class="row g-3 mb-3">
            <div class="col-md-4">
              <label class="form-label small fw-semibold">Base Price (₹) *</label>
              <input type="number" step="0.01" min="1" class="form-control" id="prod-price" placeholder="999.00" required>
            </div>
            <div class="col-md-4">
              <label class="form-label small fw-semibold">Discount Percentage (%)</label>
              <input type="number" step="0.5" min="0" max="90" class="form-control" id="prod-discount" placeholder="0">
            </div>
            <div class="col-md-4">
              <label class="form-label small fw-semibold">Initial Stock Quantity *</label>
              <input type="number" min="0" class="form-control" id="prod-stock" placeholder="25" required>
            </div>
          </div>

          <!-- Image Upload & Preview -->
          <div class="card bg-light border-0 p-3 rounded-3 mb-3">
            <label class="form-label small fw-bold text-primary"><i class="fas fa-image me-1"></i>Product Image Asset</label>
            <div class="row align-items-center g-3">
              <div class="col-md-8">
                <input type="file" class="form-control" id="prod-image-file" accept="image/*">
                <input type="hidden" id="prod-image-url">
                <small class="text-muted d-block mt-1">Accepts JPG, PNG, WEBP, SVG (Max 5MB)</small>
              </div>
              <div class="col-md-4 text-center">
                <img id="prod-image-preview" src="/assets/images/placeholder.svg" class="rounded border d-none" style="width: 80px; height: 80px; object-fit: cover;">
              </div>
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label small fw-semibold">Product Description</label>
            <textarea class="form-control" id="prod-desc" rows="3" placeholder="Detailed product overview..."></textarea>
          </div>

          <div class="mb-4">
            <label class="form-label small fw-semibold">Specifications (Key: Value | Key2: Value2)</label>
            <input type="text" class="form-control" id="prod-specs" placeholder="e.g. Battery: 30h | Bluetooth: 5.3 | Material: Aluminum">
          </div>

          <button type="submit" class="btn btn-primary px-4 py-2">
            <i class="fas fa-save me-1"></i>Save & Publish Product
          </button>
        </form>
      </div>
    </main>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/seller.js"></script>
</body>
</html>
