<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Profile & Settings - Digital Marketplace</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- FontAwesome 6 -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <!-- Google Fonts: Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Stylesheets -->
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/marketplace.css">
  <link rel="stylesheet" href="/css/dashboard.css">
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar navbar-expand-lg navbar-marketplace">
    <div class="container">
      <a class="navbar-brand brand-logo" href="/index.html">
        <i class="fas fa-cubes-stacked text-primary"></i>
        <span>Market</span>Place
      </a>
      <div class="d-flex align-items-center gap-3 ms-auto">
        <a href="/wishlist.html" class="nav-action-btn"><i class="far fa-heart"></i><span class="badge-counter wishlist-count-badge" style="display: none;">0</span></a>
        <a href="/cart.html" class="nav-action-btn"><i class="fas fa-shopping-bag"></i><span class="badge-counter cart-count-badge" style="display: none;">0</span></a>
        <div id="nav-auth-container" class="d-flex align-items-center"></div>
      </div>
    </div>
  </nav>

  <main class="container py-4 mb-5">
    
    <!-- Profile Header -->
    <div class="card card-custom p-4 mb-4">
      <div class="d-flex flex-wrap align-items-center justify-content-between gap-3">
        <div class="d-flex align-items-center gap-3">
          <div class="rounded-circle bg-primary text-white d-flex align-items-center justify-content-center" style="width: 64px; height: 64px; font-size: 1.5rem; font-weight: bold;">
            <i class="fas fa-user"></i>
          </div>
          <div>
            <h4 class="fw-bold mb-0" id="prof-display-name">Customer Name</h4>
            <span class="text-muted small" id="prof-display-email">customer@example.com</span>
            <span class="badge bg-primary ms-2" id="prof-display-role">CUSTOMER</span>
          </div>
        </div>

        <div class="d-flex gap-2">
          <a href="/orders.html" class="btn btn-outline-primary btn-sm">
            <i class="fas fa-box-open me-1"></i>My Orders
          </a>
          <button class="btn btn-outline-danger btn-sm" onclick="handleDeleteAccount()">
            <i class="fas fa-user-xmark me-1"></i>Delete Account
          </button>
        </div>
      </div>
    </div>

    <!-- Quick Stats Cards -->
    <div class="row g-3 mb-4">
      <div class="col-md-3 col-6">
        <div class="stat-card">
          <div>
            <div class="stat-value" id="stat-total-orders">0</div>
            <div class="stat-label">Total Orders</div>
          </div>
          <div class="stat-icon primary"><i class="fas fa-shopping-cart"></i></div>
        </div>
      </div>
      <div class="col-md-3 col-6">
        <div class="stat-card">
          <div>
            <div class="stat-value" id="stat-pending-orders">0</div>
            <div class="stat-label">In-Transit Orders</div>
          </div>
          <div class="stat-icon warning"><i class="fas fa-truck"></i></div>
        </div>
      </div>
      <div class="col-md-3 col-6">
        <div class="stat-card">
          <div>
            <div class="stat-value" id="stat-wishlist-count">0</div>
            <div class="stat-label">Saved Wishlist</div>
          </div>
          <div class="stat-icon danger"><i class="fas fa-heart"></i></div>
        </div>
      </div>
      <div class="col-md-3 col-6">
        <div class="stat-card">
          <div>
            <div class="stat-value" id="stat-cart-count">0</div>
            <div class="stat-label">Cart Items</div>
          </div>
          <div class="stat-icon info"><i class="fas fa-bag-shopping"></i></div>
        </div>
      </div>
    </div>

    <div class="row g-4">
      <!-- Edit Profile -->
      <div class="col-lg-7">
        <div class="card card-custom p-4">
          <h5 class="fw-bold mb-3 border-bottom pb-2"><i class="fas fa-address-card text-primary me-2"></i>Personal & Shipping Info</h5>
          
          <form id="profile-edit-form">
            <div class="row g-3 mb-3">
              <div class="col-md-6">
                <label class="form-label small fw-semibold">Full Name *</label>
                <input type="text" class="form-control" id="edit-fullname" required>
              </div>
              <div class="col-md-6">
                <label class="form-label small fw-semibold">Phone Number</label>
                <input type="tel" class="form-control" id="edit-phone">
              </div>
            </div>

            <div class="mb-3">
              <label class="form-label small fw-semibold">Delivery Street Address</label>
              <textarea class="form-control" id="edit-address" rows="2"></textarea>
            </div>

            <div class="row g-3 mb-4">
              <div class="col-md-5">
                <label class="form-label small fw-semibold">City</label>
                <input type="text" class="form-control" id="edit-city">
              </div>
              <div class="col-md-4">
                <label class="form-label small fw-semibold">State</label>
                <input type="text" class="form-control" id="edit-state">
              </div>
              <div class="col-md-3">
                <label class="form-label small fw-semibold">Postal Code</label>
                <input type="text" class="form-control" id="edit-zip">
              </div>
            </div>

            <button type="submit" class="btn btn-primary px-4">
              <i class="fas fa-save me-1"></i>Save Profile Changes
            </button>
          </form>
        </div>
      </div>

      <!-- Change Password -->
      <div class="col-lg-5">
        <div class="card card-custom p-4">
          <h5 class="fw-bold mb-3 border-bottom pb-2"><i class="fas fa-key text-warning me-2"></i>Security & Password</h5>
          
          <form id="password-change-form">
            <div class="mb-3">
              <label class="form-label small fw-semibold">Current Password *</label>
              <input type="password" class="form-control" id="pwd-current" required>
            </div>

            <div class="mb-3">
              <label class="form-label small fw-semibold">New Password *</label>
              <input type="password" class="form-control" id="pwd-new" minlength="6" required>
            </div>

            <div class="mb-4">
              <label class="form-label small fw-semibold">Confirm New Password *</label>
              <input type="password" class="form-control" id="pwd-confirm" minlength="6" required>
            </div>

            <button type="submit" class="btn btn-outline-warning text-dark w-100 fw-bold">
              Update Password
            </button>
          </form>
        </div>
      </div>
    </div>

  </main>

  <!-- FOOTER -->
  <footer class="marketplace-footer">
    <div class="container text-center text-muted small">
      <p class="mb-0">&copy; 2026 Digital Marketplace Management Platform. All rights reserved.</p>
    </div>
  </footer>

  <!-- Bootstrap 5 JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- API & Profile Scripts -->
  <script src="/js/api.js"></script>
  <script src="/js/profile.js"></script>
</body>
</html>
