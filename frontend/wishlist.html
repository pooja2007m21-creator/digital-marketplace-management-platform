<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Wishlist - Digital Marketplace</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- FontAwesome 6 -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <!-- Google Fonts: Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/marketplace.css">
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar navbar-expand-lg navbar-marketplace">
    <div class="container">
      <a class="navbar-brand brand-logo" href="index.html">
        <i class="fas fa-cubes-stacked text-primary"></i>
        <span>Market</span>Place
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#marketplaceNavbar">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="marketplaceNavbar">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-3">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="products.html">Products</a></li>
          <li class="nav-item"><a class="nav-link" href="categories.html">Categories</a></li>
        </ul>
        <div class="d-flex align-items-center gap-3">
          <a href="wishlist.html" class="nav-action-btn active"><i class="fas fa-heart text-danger"></i><span class="badge-counter wishlist-count-badge" style="display: none;">0</span></a>
          <a href="cart.html" class="nav-action-btn"><i class="fas fa-shopping-bag"></i><span class="badge-counter cart-count-badge" style="display: none;">0</span></a>
          <div id="nav-auth-container" class="d-flex align-items-center"></div>
        </div>
      </div>
    </div>
  </nav>

  <main class="container py-4 mb-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h3 class="fw-bold mb-0"><i class="fas fa-heart text-danger me-2"></i>My Saved Wishlist</h3>
    </div>

    <!-- Empty State -->
    <div id="wishlist-empty-state" class="text-center py-5 bg-white rounded-3 border p-5 d-none">
      <i class="far fa-heart fs-1 text-muted mb-3"></i>
      <h4>Your wishlist is empty</h4>
      <p class="text-muted">Save items that you want to buy later.</p>
      <a href="products.html" class="btn btn-primary px-4">Explore Products</a>
    </div>

    <!-- Wishlist Grid -->
    <div class="row" id="wishlist-grid">
      <!-- Populated dynamically -->
    </div>
  </main>

  <!-- FOOTER -->
  <footer class="marketplace-footer">
    <div class="container text-center text-muted small">
      <p class="mb-0">&copy; 2026 Digital Marketplace Management Platform. All rights reserved.</p>
    </div>
  </footer>

  <!-- Bootstrap 5 JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- API & Wishlist Scripts -->
  <script src="js/api.js"></script>
  <script src="js/wishlist.js"></script>
</body>
</html>
